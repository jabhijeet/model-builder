[project]
name = "model-builder"
dynamic = ["version"]
description = "Privacy-first local ML model builder — async DAG workflow, pluggable connectors, guided training pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["machine-learning", "mlops", "automl", "pipeline", "privacy", "local", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "aiosqlite>=0.20",
    "pandas>=2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "sqlalchemy>=2",
    "httpx>=0.27",
    "websockets>=12",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "pillow>=10",
    "librosa>=0.10",
    "kafka-python>=2.0",
    "optuna>=3.6",
]

[project.urls]
Homepage = "https://github.com/your-org/model-builder"
Documentation = "https://github.com/your-org/model-builder#readme"
Repository = "https://github.com/your-org/model-builder.git"
"Bug Tracker" = "https://github.com/your-org/model-builder/issues"
Changelog = "https://github.com/your-org/model-builder/blob/main/CHANGELOG.md"

[project.scripts]
model-builder = "model_builder.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "model_builder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["model_builder"]

[tool.hatch.build.targets.sdist]
include = [
    "/model_builder",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "build>=1.0",
    "twine>=5.0",
]
