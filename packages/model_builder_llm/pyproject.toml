[project]
name = "aimodelground-llm"
version = "0.1.0"
description = "LLM fine-tuning plugin for model-builder: LoRA/QLoRA on Llama, Mistral, GPT-2, Phi via HuggingFace PEFT"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["llm", "lora", "fine-tuning", "transformers", "peft", "model-builder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aimodelground>=0.1.0",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.29",
    "datasets>=2.19",
    "torch>=2.2",
    "pandas>=2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/your-org/model-builder"

[project.entry-points."model_builder.ml_plugins"]
"llm.lora_text" = "model_builder_llm.lora_text:LoRATextPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]


[tool.hatch.build.targets.wheel]
packages = ["model_builder_llm"]


